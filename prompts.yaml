tavily_intent: |
  Extract the core search intent from the thread and user query.
  Generate a SHORT search query (3-6 keywords) to find factual information.
  DO NOT copy the user's message. DO NOT write full sentences.
  Note: [linked content] tags contain truncated web page excerpts (first 600 chars only), they may be incomplete.
  Thread context:
  {context}
  User query: {query}
  Output strictly in this format: QUERY: [3-6 keywords] | TIME: [day/week/month/year or omit]
  Result:

chainbase_keyword: |
  Find the main keyword for: {query}
  Context hint: {context}
  Output ONLY one word.
  Result:

community_reply: |
  Query: {query}
  Context: conversation root and relevant data below.
  Task: Respond naturally using the context.
  Guidelines:
  - Keep it concise and easy to read.
  - Focus on confirmed facts; if data is incomplete, say so briefly.
  - Write ONLY the message text directly. No labels, no markers, no prefixes, no code blocks.
  Message:

owner_reply: |
  Query: {query}
  Context: conversation history below.
  Task: Respond naturally as a helpful assistant.
  Guidelines:
  - Keep it concise and easy to read.
  - Stay on topic; if unsure, give your best guess.
  - Write ONLY the message text directly. No labels, no markers, no prefixes, no code blocks.
  Message:

digest_refine: |
  Write a concise news insight.
  Topic: {keyword} - DO NOT use any of these exact words in your output: {keyword}
  Guidelines:
  - 2-3 sentences max. Focus on key facts, metrics, and impact.
  - Start with the core fact, end with a period.
  - Maximum {max_chars} characters total.
  - Use entirely different vocabulary than the topic name.
  Context: {summary}
  Insight:

chart_scene: |
  You are a philosopher, ethicist, and humanist.
  
  Evaluate this news against 12 values. For each value, give two numbers:
  - Negative impact (0 to -5)
  - Positive impact (0 to +5)
  
  If no impact, use 0.
  
  Values: Life, Freedom, Justice, Truth, Security, Prosperity, Equality, Dignity, Peace, Sustainability, Knowledge, Solidarity
  
  Output ONLY a JSON array of 12 pairs. NO comments. NO explanations. NO text before or after.
  
  Example: [[-3,0],[-2,0],[-1,0],[0,0],[0,0],[-2,0],[-1,0],[-3,0],[-2,0],[0,0],[0,0],[0,0]]
  
  News:
  {context}
  
  JSON:

intent_check: |
  Classify this comment as CASUAL or SUBSTANTIVE.
  CASUAL = message consisting solely of reactions, acknowledgments, greetings, or emojis without any informational content, question, opinion, or statement related to the topic.
  SUBSTANTIVE = message containing any meaningful text that engages with the topic, asks a question, expresses an opinion, requests information, or makes a statement, regardless of whether emojis or reaction words are also present.
  Rule: Presence of emojis or reaction words does not make a message CASUAL if it also contains substantive textual content. Only messages with zero substantive content are CASUAL.
  Message: {message}
  Topic: {root_topic}
  Output ONE word: CASUAL or SUBSTANTIVE
  Result:

sentiment_check: |
  What is the sentiment of this comment?
  POSITIVE = supportive, constructive, enthusiastic.
  NEGATIVE = hostile, spam, dismissive.
  NEUTRAL = factual, question, ambiguous.
  Comment: {message}
  Topic: {root_topic}
  Output ONE word: POSITIVE, NEUTRAL, or NEGATIVE.
  Result:

validate_search: |
  Are these search results topically related to the query?
  Query: {query}
  Sample: {sample}
  Rules:
  - RELEVANT if results discuss the same topic, event, entity, or theme as the query, even if details differ.
  - IRRELEVANT only if results are about a completely unrelated subject.
  - Partial topical overlap is RELEVANT.
  Output ONE word: RELEVANT or IRRELEVANT
  Result:

keyword_regenerate: |
  From the QUERY below, extract ONE specific keyword.
  Ignore generic words. NEVER use: {tried_keywords}
  QUERY: {query}
  Context: {root_topic}
  Keyword:

dyor_fallback: |
  No search data found for {keyword}.
  Respond based ONLY on the provided context. Do NOT invent facts, dates, names, or details that are not explicitly present in the context.
  If the context does not contain enough information to respond meaningfully, say so briefly and suggest DYOR.
  Context: {context}
  Query: {query}
  Message:

casual_reply: |
  User sent a casual message.
  Task: Send one short, neutral-positive acknowledgment.
  Guidelines:
  - Friendly but generic tone.
  - No questions, no conversation starters, no search triggers.
  - End after the statement.
  - Write ONLY the message text directly. No labels, no prefixes.
  Message:

scout_welcome: |
  A new project or creator just joined Bluesky. Write a unique welcome post.
  Guidelines:
  - You MUST include @{handle} in the text so it becomes a clickable mention and sends them a notification.
  - Personalize based on their display name and bio.
  - Friendly, concise, genuine tone.
  - No questions, no calls to action.
  - One short paragraph max.
  Profile info: {context}
  Welcome post:
