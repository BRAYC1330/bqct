tavily_intent: |
  Extract search intent from the query.
  Output: QUERY: [clean query] | TIME: [day/week/month/year or omit]
  Query: {query}
  Result:

chainbase_keyword: |
  Find the main keyword for: "{query}"
  Context hint: {context}
  Output ONLY one word.
  Result:

community_reply: |
  Query: {query}
  Context: conversation root and relevant data below.
  Task: Answer naturally using the context.
  Guidelines:
  - Keep it concise and easy to read.
  - Focus on confirmed facts; if data is incomplete, say so briefly.
  Reply:

owner_reply: |
  Query: {query}
  Context: conversation history below.
  Task: Answer naturally as a helpful assistant.
  Guidelines:
  - Keep it concise and easy to read.
  - Stay on topic; if unsure, give your best guess.
  - Output plain text only, no code blocks.
  Reply:

digest_refine: |
  Write a concise news insight based on the context.
  Topic reference: {keyword} (do not repeat in output).
  Guidelines:
  - 2-3 sentences max. Focus on key facts, metrics, and impact.
  - Start with the core fact, end with a period.
  - Maximum {max_chars} characters total.
  Context: {summary}
  Insight:

context_memory: |
  Summarize the conversation history.
  Keep only key facts and open questions.
  History: {history}
  Summary:

intent_check: |
  Classify this comment as CASUAL or SUBSTANTIVE.

  CASUAL = reaction, acknowledgment, greeting, emoji, short phrase without information request, or message that does not semantically relate to the topic content.
  SUBSTANTIVE = explicit question, request for data, analysis, explanation, or actionable information directly related to the topic.

  Rule: If the message lacks an explicit information request or does not meaningfully engage with the topic content, classify as CASUAL regardless of individual words.

  Message: "{message}"
  Topic: "{root_topic}"
  Output ONE word: CASUAL or SUBSTANTIVE
  Result:

sentiment_check: |
  What is the sentiment of this comment?
  POSITIVE = supportive, constructive, enthusiastic.
  NEGATIVE = hostile, spam, dismissive.
  NEUTRAL = factual, question, ambiguous.
  Comment: "{message}"
  Topic: "{root_topic}"
  Output ONE word: POSITIVE, NEUTRAL, or NEGATIVE.
  Result:

validate_search: |
  Are these results relevant to the query?
  Query: "{query}"
  Sample: {sample}
  Output ONE word: RELEVANT or IRRELEVANT.
  Result:

keyword_regenerate: |
  From the QUERY below, extract ONE specific keyword.
  Ignore generic words. NEVER use: {tried_keywords}
  
  QUERY: {query}
  Context: {root_topic}
  
  Keyword:

dyor_fallback: |
  No search data for "{keyword}".
  Answer based on context only.
  Guidelines:
  - Be helpful and concise.
  - If unsure, suggest DYOR.
  Context: {context}
  Query: {query}
  Reply:

casual_reply: |
  User sent a casual message.
  Task: Send one short, neutral-positive acknowledgment.
  Guidelines:
  - Friendly but generic tone.
  - No questions, no conversation starters, no search triggers.
  - End after the statement.
  Reply:
