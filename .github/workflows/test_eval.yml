name: Test News Evaluation
on:
  workflow_dispatch:
    inputs:
      news:
        description: 'News text to evaluate'
        required: false
        type: string
        default: 'The Federal Reserve released minutes from its June meeting, revealing a divided committee that voted unanimously to hold interest rates steady at 3.50%–3.75%. While all participants supported the pause, a few officials argued for a rate hike, citing persistent inflation risks driven by AI infrastructure investment, energy prices, and tariffs. Fed staff raised inflation forecasts for 2026–2027 and lowered GDP growth projections, with Chair Kevin Warsh describing internal debates as intense. Market expectations shifted as traders priced in potential rate hikes, with some officials indicating that further tightening may be necessary if inflation does not trend toward the 2% target. The minutes highlighted AI-driven demand as a new structural inflationary pressure, complicating the path for future monetary policy. Fed Chair Kevin Warsh is scheduled to testify before the Senate Banking Committee on July 15.'
      prompt_variant:
        description: 'Prompt variant (all = run all variants)'
        required: false
        type: choice
        options:
          - all
          - simple_v2
        default: 'all'
concurrency:
  group: test-eval-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Cache Qwen model file
        uses: actions/cache@v4
        with:
          path: models/Qwen3-14B-Q5_K_M.gguf
          key: qwen3-14b-q5km-v1
      - name: Install deps
        run: |
          pip install --upgrade pip setuptools wheel
          CMAKE_ARGS="-DGGML_BLAS=OFF -DGGML_CUDA=OFF" pip install --prefer-binary llama-cpp-python==0.3.20
          pip install pyyaml
      - name: Verify model
        run: |
          set -e
          mkdir -p models
          FILE="models/Qwen3-14B-Q5_K_M.gguf"
          EXPECTED_SHA256="${{ secrets.MODEL_SHA256 }}"
          MIN_SIZE=100000000
          if [ -f "$FILE" ]; then
            FILE_SIZE=$(stat -c%s "$FILE" 2>/dev/null || echo 0)
            if [ "$FILE_SIZE" -ge "$MIN_SIZE" ]; then
              if [ -n "$EXPECTED_SHA256" ] && echo "$EXPECTED_SHA256  $FILE" | sha256sum -c - >/dev/null 2>&1; then
                echo "[OK] Model cached (${FILE_SIZE} bytes)"
              else
                echo "[WARN] Hash mismatch, removing"
                rm -f "$FILE"
              fi
            else
              rm -f "$FILE"
            fi
          fi
          if [ ! -f "$FILE" ]; then
            echo "[INFO] Downloading model..."
            curl -L --retry 5 --retry-delay 15 -o "$FILE" "https://huggingface.co/Qwen/Qwen3-14B-GGUF/resolve/main/Qwen3-14B-Q5_K_M.gguf?download=true"
            FILE_SIZE=$(stat -c%s "$FILE" 2>/dev/null || echo 0)
            echo "[INFO] Downloaded: ${FILE_SIZE} bytes"
            if [ "$FILE_SIZE" -lt "$MIN_SIZE" ]; then
              echo "[ERROR] Too small"
              rm -f "$FILE"
              exit 1
            fi
            if [ -n "$EXPECTED_SHA256" ]; then
              echo "$EXPECTED_SHA256  $FILE" | sha256sum -c -
            fi
          fi
      - name: Run test evaluation
        env:
          NEWS_TEXT: ${{ inputs.news }}
          PROMPT_VARIANT: ${{ inputs.prompt_variant }}
          LLAMA_NO_ACCELERATE: 1
        run: python test_eval.py
