name: Test News Evaluation
on:
  workflow_dispatch:
    inputs:
      news:
        description: 'News text to evaluate'
        required: false
        type: string
        default: 'The World Health Organization announced a breakthrough in cancer treatment: a new universal vaccine has shown 95% effectiveness against all major cancer types in phase 3 clinical trials involving 50,000 patients across 40 countries. The vaccine, developed using AI-driven research, costs only $10 per dose and will be distributed free to low-income countries. Scientists estimate this could save 10 million lives annually and reduce global healthcare costs by $2 trillion over the next decade. The UN called it "the greatest medical achievement in human history".'
concurrency:
  group: test-eval-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Cache Qwen model file
        uses: actions/cache@v4
        with:
          path: models/Qwen3-14B-Q5_K_M.gguf
          key: qwen3-14b-q5km-v1
      - name: Install deps
        run: |
          pip install --upgrade pip setuptools wheel
          CMAKE_ARGS="-DGGML_BLAS=OFF -DGGML_CUDA=OFF" pip install --prefer-binary llama-cpp-python==0.3.20
          pip install pyyaml
      - name: Verify model
        run: |
          set -e
          mkdir -p models
          FILE="models/Qwen3-14B-Q5_K_M.gguf"
          EXPECTED_SHA256="${{ secrets.MODEL_SHA256 }}"
          MIN_SIZE=100000000
          if [ -f "$FILE" ]; then
            FILE_SIZE=$(stat -c%s "$FILE" 2>/dev/null || echo 0)
            if [ "$FILE_SIZE" -ge "$MIN_SIZE" ]; then
              if [ -n "$EXPECTED_SHA256" ] && echo "$EXPECTED_SHA256  $FILE" | sha256sum -c - >/dev/null 2>&1; then
                echo "[OK] Model cached (${FILE_SIZE} bytes)"
              else
                echo "[WARN] Hash mismatch, removing"
                rm -f "$FILE"
              fi
            else
              rm -f "$FILE"
            fi
          fi
          if [ ! -f "$FILE" ]; then
            echo "[INFO] Downloading model..."
            curl -L --retry 5 --retry-delay 15 -o "$FILE" "https://huggingface.co/Qwen/Qwen3-14B-GGUF/resolve/main/Qwen3-14B-Q5_K_M.gguf?download=true"
            FILE_SIZE=$(stat -c%s "$FILE" 2>/dev/null || echo 0)
            echo "[INFO] Downloaded: ${FILE_SIZE} bytes"
            if [ "$FILE_SIZE" -lt "$MIN_SIZE" ]; then
              echo "[ERROR] Too small"
              rm -f "$FILE"
              exit 1
            fi
            if [ -n "$EXPECTED_SHA256" ]; then
              echo "$EXPECTED_SHA256  $FILE" | sha256sum -c -
            fi
          fi
      - name: Run test evaluation
        env:
          NEWS_TEXT: ${{ inputs.news }}
          LLAMA_NO_ACCELERATE: 1
        run: python test_eval.py
