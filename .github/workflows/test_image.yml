name: Test Image Generation
on:
  workflow_dispatch:
    inputs:
      style_prompt:
        description: 'Style prompt'
        required: true
        type: string
      news_context:
        description: 'News context'
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install diffusers transformers accelerate safetensors huggingface_hub
      
      - name: Download SDXL-Turbo model
        env:
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
        run: |
          python -c "
          import os
          from huggingface_hub import snapshot_download
          token = os.environ.get('HF_API_TOKEN', '').strip()
          kwargs = {}
          if token:
              kwargs['token'] = token
          snapshot_download('stabilityai/sdxl-turbo', local_dir='models/sdxl-turbo', **kwargs)
          "
      
      - name: Generate test image
        env:
          STYLE_PROMPT: ${{ inputs.style_prompt }}
          NEWS_CONTEXT: ${{ inputs.news_context }}
        run: python test_image_gen.py "$STYLE_PROMPT" "$NEWS_CONTEXT"
      
      - name: Upload test image
        uses: actions/upload-artifact@v4
        with:
          name: test-image
          path: test_output.png
