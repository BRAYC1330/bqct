name: Test Image Generation
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install diffusers==0.25.1 transformers accelerate safetensors huggingface_hub
      
      - name: Cache SDXL Base model
        uses: actions/cache@v4
        with:
          path: models/sdxl-base
          key: sdxl-base-v1
      
      - name: Download SDXL Base model
        env:
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
        run: |
          echo "Checking model..."
          if [ ! -f "models/sdxl-base/model_index.json" ]; then
            echo "Model not found, downloading..."
            python -c "
          import os
          import time
          from huggingface_hub import snapshot_download
          token = os.environ.get('HF_API_TOKEN', '').strip()
          kwargs = {}
          if token:
              kwargs['token'] = token
          
          max_retries = 3
          for attempt in range(max_retries):
              try:
                  print(f'Attempt {attempt + 1}/{max_retries}')
                  snapshot_download(
                      'stabilityai/stable-diffusion-xl-base-1.0',
                      local_dir='models/sdxl-base',
                      **kwargs
                  )
                  print('Download successful')
                  break
              except Exception as e:
                  print(f'Download failed: {e}')
                  if attempt < max_retries - 1:
                      print('Cleaning up and retrying...')
                      import shutil
                      if os.path.exists('models/sdxl-base'):
                          shutil.rmtree('models/sdxl-base')
                      time.sleep(10)
                  else:
                      raise
          "
          else
            echo "✓ SDXL Base model cached, skipping download"
          fi
      
      - name: Download Banksy LoRA
        run: |
          mkdir -p lora
          if [ ! -f "lora/Banksy Style.safetensors" ]; then
            echo "Downloading LoRA..."
            wget -O "lora/Banksy Style.safetensors" "https://huggingface.co/KappaNeuro/banksy-style/resolve/main/Banksy%20Style.safetensors"
          else
            echo "✓ LoRA already exists"
          fi
      
      - name: Generate test images
        run: python test_image_gen.py test_prompts.json
      
      - name: Commit and push images
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add output/
          git commit -m "Test images: ${{ github.run_number }}" || echo "No changes"
          git push
      
      - name: Clean up model to free space for cache
        if: always()
        run: |
          echo "Removing model to free space for cache..."
          rm -rf models/sdxl-base
          rm -rf lora
          df -h
