name: Test Image Generation
on:
  workflow_dispatch:
    inputs:
      news_context:
        description: 'News context - what to draw'
        required: true
        type: string
        default: 'Bank of America approves new loan program for small businesses, offering reduced interest rates to stimulate economic growth'
      style_prompt:
        description: 'Style description - how to draw it'
        required: true
        type: string
        default: 'Style: Banksy. clean professional stencil graffiti on pure white wall, black silhouette, the main object is in the center of the wall, with a large indentation around it on all sides.'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install diffusers transformers accelerate safetensors huggingface_hub
      
      - name: Cache SDXL-Turbo model
        uses: actions/cache@v4
        with:
          path: models/sdxl-turbo
          key: sdxl-turbo-v1
      
      - name: Download SDXL-Turbo model
        env:
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
        run: |
          if [ ! -f "models/sdxl-turbo/model_index.json" ]; then
            echo "Downloading SDXL-Turbo model..."
            python -c "
          import os
          from huggingface_hub import snapshot_download
          token = os.environ.get('HF_API_TOKEN', '').strip()
          kwargs = {}
          if token:
              kwargs['token'] = token
          snapshot_download('stabilityai/sdxl-turbo', local_dir='models/sdxl-turbo', **kwargs)
          "
          else
            echo "SDXL-Turbo model cached"
          fi
      
      - name: Generate test image
        env:
          NEWS_CONTEXT: ${{ inputs.news_context }}
          STYLE_PROMPT: ${{ inputs.style_prompt }}
        run: python test_image_gen.py "$NEWS_CONTEXT" "$STYLE_PROMPT"
      
      - name: Commit and push image
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add output/test_output.png
          git commit -m "Test image: ${{ github.run_number }}" || echo "No changes"
          git push
      
      - name: Clean up model to free space for cache
        if: always()
        run: |
          echo "Removing model to free space for cache..."
          rm -rf models/sdxl-turbo
          df -h
