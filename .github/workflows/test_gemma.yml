name: Test Gemma 4
on:
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Test type'
        required: true
        type: choice
        options:
          - digest_mini
          - digest_full
          - comment_reply
        default: 'digest_mini'
      test_query:
        description: 'Query for comment_reply test'
        required: false
        type: string
        default: 'What do you think about BTC?'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install deps
        run: |
          pip install --upgrade pip setuptools wheel
          CMAKE_ARGS="-DGGML_BLAS=OFF -DGGML_CUDA=OFF" pip install --prefer-binary llama-cpp-python==0.3.20
          pip install pyyaml httpx Pillow trafilatura regex huggingface_hub pydantic
      - name: Download Gemma 4
        run: |
          set -e
          mkdir -p models
          FILE="models/gemma-4-12b-it-qat-q4_0.gguf"
          MIN_SIZE=100000000
          if [ -f "$FILE" ]; then
            FILE_SIZE=$(stat -c%s "$FILE" 2>/dev/null || echo 0)
            if [ "$FILE_SIZE" -ge "$MIN_SIZE" ]; then
              echo "[OK] Gemma model exists (${FILE_SIZE} bytes)"
              exit 0
            fi
            rm -f "$FILE"
          fi
          echo "[INFO] Downloading Gemma 4 12B..."
          curl -L --retry 5 --retry-delay 15 -o "$FILE" \
            "https://huggingface.co/google/gemma-4-12B-it-qat-q4_0-gguf/resolve/main/gemma-4-12b-it-qat-q4_0.gguf?download=true"
          FILE_SIZE=$(stat -c%s "$FILE" 2>/dev/null || echo 0)
          echo "[INFO] Downloaded: ${FILE_SIZE} bytes"
          if [ "$FILE_SIZE" -lt "$MIN_SIZE" ]; then
            echo "[ERROR] File too small"
            rm -f "$FILE"
            exit 1
          fi
      - name: Run Gemma Test
        env:
          PYTHONUNBUFFERED: "1"
          TEST_TYPE: ${{ inputs.test_type }}
          TEST_QUERY: ${{ inputs.test_query }}
          BOT_HANDLE: ${{ secrets.BOT_HANDLE }}
          BOT_PASSWORD: ${{ secrets.BOT_PASSWORD }}
          BOT_DID: ${{ secrets.BOT_DID }}
          OWNER_DID: ${{ secrets.OWNER_DID }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
          RAW_DEBUG: "true"
        run: python test_gemma.py
