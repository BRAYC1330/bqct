name: Bluesky AI Bot
on:
  workflow_dispatch:
    inputs:
      manual_digest:
        description: 'Generate digest manually (optional)'
        required: false
        type: choice
        options:
          - none
          - mini
          - full
        default: 'none'
concurrency:
  group: bluesky-bot-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  run:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      new_digest_uri: ${{ steps.run.outputs.new_digest_uri }}
      bot_status: ${{ steps.run.outputs.bot_status }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install checker deps
        run: pip install httpx pydantic Pillow
      - name: Check
        id: checker
        env:
          BOT_HANDLE: ${{ secrets.BOT_HANDLE }}
          BOT_PASSWORD: ${{ secrets.BOT_PASSWORD }}
          OWNER_DID: ${{ secrets.OWNER_DID }}
          BOT_DID: ${{ secrets.BOT_DID }}
          PAT: ${{ secrets.PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LAST_PROCESSED: ${{ vars.LAST_PROCESSED || secrets.LAST_PROCESSED }}
          MANUAL_DIGEST_TYPE: ${{ inputs.manual_digest }}
        run: python check.py
      - name: Free disk space
        if: steps.checker.outputs.status == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h
      - name: Cache Qwen model file
        if: steps.checker.outputs.status == 'true'
        uses: actions/cache@v4
        with:
          path: models/Qwen3-14B-Q5_K_M.gguf
          key: qwen3-14b-q5km-v1
      - name: Cache heavy pip dependencies
        if: steps.checker.outputs.status == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: heavy-deps-ubuntu-24.04-v1
          restore-keys: |
            heavy-deps-ubuntu-24.04-
      - name: Install heavy deps
        if: steps.checker.outputs.status == 'true'
        run: |
          pip install --upgrade pip setuptools wheel
          CMAKE_ARGS="-DGGML_BLAS=OFF -DGGML_CUDA=OFF" pip install --prefer-binary llama-cpp-python==0.3.20
          pip install pyyaml PyNaCl trafilatura regex Pillow httpx pydantic
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
      - name: Verify and Download Qwen Model
        if: steps.checker.outputs.status == 'true'
        run: |
          set -e
          mkdir -p models
          FILE="models/Qwen3-14B-Q5_K_M.gguf"
          EXPECTED_SHA256="${{ secrets.MODEL_SHA256 }}"
          MIN_SIZE=100000000
          if [ -z "$EXPECTED_SHA256" ]; then
            echo "[WARN] MODEL_SHA256 secret is empty or not set!"
          else
            echo "[OK] MODEL_SHA256 secret is set (length: ${#EXPECTED_SHA256})"
          fi
          if [ -f "$FILE" ]; then
            FILE_SIZE=$(stat -c%s "$FILE" 2>/dev/null || echo 0)
            if [ "$FILE_SIZE" -ge "$MIN_SIZE" ]; then
              if [ -n "$EXPECTED_SHA256" ] && echo "$EXPECTED_SHA256  $FILE" | sha256sum -c - >/dev/null 2>&1; then
                echo "[OK] Qwen model cached and verified (${FILE_SIZE} bytes), skipping download."
              elif [ -z "$EXPECTED_SHA256" ]; then
                echo "[OK] Qwen model cached (${FILE_SIZE} bytes), no hash to verify, skipping download."
              else
                echo "[WARN] Hash mismatch on cached file, removing."
                rm -f "$FILE"
              fi
            else
              echo "[WARN] Cached file too small (${FILE_SIZE} bytes), removing."
              rm -f "$FILE"
            fi
          fi
          if [ ! -f "$FILE" ]; then
            echo "[INFO] Downloading Qwen model..."
            curl -L --retry 5 --retry-delay 15 -o "$FILE" "https://huggingface.co/Qwen/Qwen3-14B-GGUF/resolve/main/Qwen3-14B-Q5_K_M.gguf?download=true"
            FILE_SIZE=$(stat -c%s "$FILE" 2>/dev/null || echo 0)
            echo "[INFO] Downloaded file size: ${FILE_SIZE} bytes"
            if [ "$FILE_SIZE" -lt "$MIN_SIZE" ]; then
              echo "[ERROR] Downloaded file too small (${FILE_SIZE} bytes), likely an error page."
              rm -f "$FILE"
              exit 1
            fi
            if [ -n "$EXPECTED_SHA256" ]; then
              echo "[INFO] Verifying downloaded Qwen model..."
              echo "$EXPECTED_SHA256  $FILE" | sha256sum -c -
            fi
          fi
      - name: Run Bot
        id: run
        if: steps.checker.outputs.status == 'true'
        env:
          PYTHONUNBUFFERED: "1"
          TASKS_JSON: ${{ steps.checker.outputs.tasks }}
          PREV_STATE_JSON: ${{ steps.checker.outputs.state_json }}
          SCHED_TYPE: ${{ steps.checker.outputs.scheduled_type }}
          BOT_HANDLE: ${{ secrets.BOT_HANDLE }}
          BOT_PASSWORD: ${{ secrets.BOT_PASSWORD }}
          BOT_DID: ${{ secrets.BOT_DID }}
          OWNER_DID: ${{ secrets.OWNER_DID }}
          PAT: ${{ secrets.PAT }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LINK_CACHE_TTL: 300
          MAX_LINK_CONTENT_SIZE: 600
          LLAMA_NO_ACCELERATE: 1
          DEBUG_OWNER: "true"
          LOG_PROMPTS: "false"
        run: python bot.py
      - name: Health check alert
        if: failure()
        run: |
          if [ -n "${{ secrets.ALERT_WEBHOOK }}" ]; then
            curl -X POST -H "Content-Type: application/json" \
              -d "{\"text\":\"Bluesky Bot failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
              "${{ secrets.ALERT_WEBHOOK }}" || true
          fi
