      - name: Verify and Download Model
        if: steps.checker.outputs.status == 'true'
        run: |
          set -e
          mkdir -p models
          FILE="models/qwen2.5-coder-14b-instruct-q5_k_m.gguf"
          EXPECTED_SHA256="${{ secrets.MODEL_SHA256 }}"
          MIN_SIZE=100000000

          # Отладка: проверить что секрет не пустой
          if [ -z "$EXPECTED_SHA256" ]; then
            echo "[WARN] MODEL_SHA256 secret is empty or not set!"
          else
            echo "[OK] MODEL_SHA256 secret is set (length: ${#EXPECTED_SHA256})"
          fi

          if [ -f "$FILE" ]; then
            FILE_SIZE=$(stat -c%s "$FILE" 2>/dev/null || echo 0)
            if [ "$FILE_SIZE" -ge "$MIN_SIZE" ]; then
              if [ -n "$EXPECTED_SHA256" ] && echo "$EXPECTED_SHA256  $FILE" | sha256sum -c - >/dev/null 2>&1; then
                echo "[OK] Model cached and verified (${FILE_SIZE} bytes), skipping download."
                exit 0
              elif [ -z "$EXPECTED_SHA256" ]; then
                echo "[OK] Model cached (${FILE_SIZE} bytes), no hash to verify, skipping download."
                exit 0
              else
                echo "[WARN] Hash mismatch on cached file, removing."
                rm -f "$FILE"
              fi
            else
              echo "[WARN] Cached file too small (${FILE_SIZE} bytes), removing."
              rm -f "$FILE"
            fi
          fi

          echo "[INFO] Downloading model..."
          curl -L --retry 5 --retry-delay 15 -o "$FILE" "https://huggingface.co/Qwen/Qwen2.5-Coder-14B-Instruct-GGUF/resolve/main/qwen2.5-coder-14b-instruct-q5_k_m.gguf?download=true"
          FILE_SIZE=$(stat -c%s "$FILE" 2>/dev/null || echo 0)
          echo "[INFO] Downloaded file size: ${FILE_SIZE} bytes"
          if [ "$FILE_SIZE" -lt "$MIN_SIZE" ]; then
            echo "[ERROR] Downloaded file too small (${FILE_SIZE} bytes), likely an error page."
            rm -f "$FILE"
            exit 1
          fi
          if [ -n "$EXPECTED_SHA256" ]; then
            echo "[INFO] Verifying downloaded model..."
            echo "$EXPECTED_SHA256  $FILE" | sha256sum -c -
          fi