name: Test Chart Generator
on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Chart title'
        required: false
        default: 'AI SENTIMENT INDEX'
      subtitle:
        description: 'Chart subtitle'
        required: false
        default: 'TEST • CHART • RENDER'
      candles_json:
        description: 'JSON array of 12 candles: [{"o":6,"h":7,"l":5,"c":6.5}, ...]'
        required: true
        default: '[{"o":6.0,"h":6.5,"l":5.5,"c":6.2},{"o":6.2,"h":7.5,"l":6.0,"c":7.2},{"o":7.2,"h":10.0,"l":7.0,"c":9.5},{"o":9.5,"h":10.0,"l":7.0,"c":7.5},{"o":7.5,"h":8.0,"l":3.0,"c":3.5},{"o":3.5,"h":4.0,"l":2.0,"c":2.5},{"o":2.5,"h":3.5,"l":2.0,"c":3.2},{"o":3.2,"h":4.5,"l":3.0,"c":4.2},{"o":4.2,"h":5.0,"l":3.8,"c":4.0},{"o":4.0,"h":4.8,"l":3.5,"c":4.5},{"o":4.5,"h":5.5,"l":4.2,"c":5.2},{"o":5.2,"h":6.0,"l":5.0,"c":5.8}]'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          pip install Pillow
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
      - name: Generate chart
        env:
          TITLE: ${{ inputs.title }}
          SUBTITLE: ${{ inputs.subtitle }}
          CANDLES_JSON: ${{ inputs.candles_json }}
        run: python test_chart.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-chart
          path: chart_output.png
          retention-days: 30
