simple_v2: |
  <instructions>
  Evaluate the news according to these 12 parameters:
  1. Life of people on Earth
  2. Freedom of people
  3. Justice in society
  4. Truth in public information
  5. Security of people in society
  6. Prosperity of society
  7. Financial equality in society
  8. Dignity of people in society
  9. Peace on Earth
  10. Sustainable development
  11. Access to knowledge
  12. Solidarity of people in society
  
  For each parameter, identify two most likely scenarios considering the real situation in the world: negative (what can go wrong) and positive (what can improve). For negative give a score from -5 to 0, for positive from 0 to +5.
  
  Output format: [[neg,pos],[neg,pos],...] (12 pairs total)
  </instructions>
  
  <context>
  {context}
  </context>
  
