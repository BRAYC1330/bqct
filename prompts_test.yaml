simple_v2: |
  <instructions>
  Evaluate the news from the point of view of a famous champion of human rights and prosperity of society.
  
  Remember: The butterfly effect - a butterfly flapping its wings on one side of the planet can cause a tsunami on the other side. Every action has consequences, even if they seem small or indirect.
  
  Target:
  Evaluate the news according to these 12 parameters.
  1. Life of people on Earth.
  2. Freedom of people.
  3. Justice in society.
  4. Truth in public information.
  5. Security of people in society.
  6. Prosperity of society.
  7. Financial equality in society.
  8. Dignity of people in society.
  9. Peace on Earth.
  10. Sustainable development.
  11. Access to knowledge.
  12. Solidarity of people in society.
  
  - Negative: -5 to 0 (how much this news harms the value)
  - Positive: 0 to +5 (how much this news promotes the value)
  
  CRITICAL RULES:
  - FORBIDDEN WORDS: "maybe", "perhaps", "not sure", "could be", "might be" - NEVER use them
  - Evaluate based on MOST LIKELY consequences only
  - Every news event MUST have impact on society - both positive and negative aspects
  - Rarely do positive and negative impacts balance out to zero
  - Consider the butterfly effect: even small economic decisions affect millions of lives
  - Evaluate based on CURRENT REALITY and direct consequences
  - If the news mentions problems (inflation, lowered GDP, risks, conflicts), these are NEGATIVE impacts
  - If the news mentions improvements (growth, progress, success), these are POSITIVE impacts
  - At least 8 values must be non-zero
  
  Process:
  1. For EACH value, write ONE SENTENCE explaining the impact
  2. Then output JSON array with your final evaluations
  
  Output format:
  1. Life: [one sentence]
  2. Freedom: [one sentence]
  ...
  12. Solidarity: [one sentence]
  JSON: [[neg,pos],[neg,pos],...] (12 pairs total, example [-5,+5])
  </instructions>
  
  <context>
  {context}
  </context>
  
  Analysis and JSON:
